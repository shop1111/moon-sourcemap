name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Update dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check all stable targets
        run: moon check --target all --deny-warn --warn-list +73
      - name: Build all stable targets
        run: moon build --target all --deny-warn
      - name: Test all stable targets
        run: moon test --target all --deny-warn
      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code
      - name: CLI acceptance
        run: |
          mkdir -p _build/ci
          moon run --target native cmd/main -- validate examples/demo.min.js.map
          moon run --target native cmd/main -- lookup examples/demo.min.js.map --line 0 --column 4 --format json
          moon run --target native cmd/main -- symbolize examples/demo.min.js.map examples/frames.txt --format json
          moon run --target native cmd/main -- flatten examples/demo.min.js.map -o _build/ci/flattened.map
          moon run --target native cmd/main -- compose examples/outer.map examples/inner.map -o _build/ci/composed.map
          moon run --target native cmd/main -- validate _build/ci/composed.map
      - name: Effective production line count
        shell: bash
        run: |
          count="$(
            find . -name '*.mbt' \
              -not -path './_build/*' \
              -not -path './.mooncakes/*' \
              -not -name '*_test.mbt' \
              -not -name '*_wbtest.mbt' \
              -print0 |
            xargs -0 awk 'NF && $0 !~ /^[[:space:]]*\/\// { count++ } END { print count + 0 }'
          )"
          echo "effective production MoonBit lines: $count"
          test "$count" -ge 2000
      - name: Package
        run: |
          moon package
          test -s _build/publish/shop1111-moon_sourcemap-0.1.0.zip
