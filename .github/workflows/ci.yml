name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Update dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check all stable targets
        run: moon check --target all --deny-warn
      - name: Build all stable targets
        run: moon build --target all --deny-warn
      - name: Test all stable targets
        run: moon test --target all --deny-warn
      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code
      - name: Package
        run: |
          moon package
          test -s _build/publish/shop1111-moon_sourcemap-0.1.0.zip
